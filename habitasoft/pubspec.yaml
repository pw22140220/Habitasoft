name: habitasoft
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # >>> AÑADIR ESTO <<<
  http: ^1.1.0
  flutter_secure_storage: ^9.0.0  # la usaremos después para tokens
  table_calendar: ^3.0.9  # para calendario interactivo en amenities
  url_launcher: ^6.2.2  # para abrir WhatsApp desde ayuda y soporte
  local_auth: ^2.1.7  # para autenticación biométrica (huella/Face ID)
  shared_preferences: ^2.2.2  # para guardar preferencias locales (biometría, modo oscuro)
  provider: ^6.1.2  # para gestión de estado con ChangeNotifier
  qr_flutter: ^4.1.0  # para generar códigos QR
  mobile_scanner: ^4.0.0  # para escanear códigos QR

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/